(()=>{try{

precision highp float;in vec3 position;in vec3 normal;in vec3 colour;in float surface;uniform mat4 vp;out vec3 N;out vec3 P;out vec3 C;flat out int region;void main(){N=normal;P=position;C=colour;region=int(surface+.5);gl_Position=vp*vec4(position,1.);}`;

  col=mix(col,vec3(dot(col,vec3(.2126,.7152,.0722))),monochrome);

function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}

const worldSelect=document.querySelector('#world');
for(const planet of Planets.PLANETS){const option=document.createElement('option');option.value=planet.id;option.textContent=planet.name;worldSelect.append(option)}
const query=new URLSearchParams(location.search);worldSelect.value=Planets.planet(query.get('world'))?query.get('world'):'embervale';

const seed='Solar-Orbit-188';

let paletteIndex=Number(query.get('palette'));
if(query.has('palette')&&Number.isInteger(paletteIndex)&&paletteIndex>=0&&paletteIndex<PALETTES.length)mode='palette';
else paletteIndex=null;
const greyPalette={pal5:[.12,.3,.48,.68,.88].map(v=>[v,v,v])};
const paintKeys=['body','wings','canopy','underside','accent'];
const hex=c=>'#'+c.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);

let world,mesh;
function makePaint(){world=World.generate(seed,Planets.planet(worldSelect.value),mode==='palette'?{palIdx:paletteIndex}:{});mesh=Ship05.build(mode==='grey'?greyPalette:world,mode==='custom'?customPaint:null)}
makePaint();
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,mesh.vertices,gl.STATIC_DRAW);for(const [i,name] of ['position','normal','colour'].entries()){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,40,i*12)}const surface=gl.getAttribLocation(program,'surface');gl.enableVertexAttribArray(surface);gl.vertexAttribPointer(surface,1,gl.FLOAT,false,40,36);const index=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,index);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,mesh.indices,gl.STATIC_DRAW);gl.enable(gl.DEPTH_TEST);

const vp=gl.getUniformLocation(program,'vp'),eye=gl.getUniformLocation(program,'eye');let az=.75,el=.5,distance=13,queued=false,drag=null;const target=[0,0,0];
function draw(){queued=false;if(document.hidden)return;const dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const d=distance*(canvas.width<canvas.height?1.25:1),pos=[Math.sin(az)*Math.cos(el)*d,Math.sin(el)*d,Math.cos(az)*Math.cos(el)*d];gl.uniformMatrix4fv(vp,false,M.mul4(M.perspective(38*Math.PI/180,canvas.width/canvas.height,.1,100),M.lookAt(pos,target,[0,1,0])));gl.uniform3fv(eye,pos);gl.uniform1f(mono,mode==='grey'?1:0);gl.drawElements(gl.TRIANGLES,mesh.indices.length,gl.UNSIGNED_INT,0);window.shipPreview={triangles:mesh.indices.length/3,view:{az,el,distance},renders:(window.shipPreview?.renders||0)+1};}
function request(){if(!queued){queued=true;requestAnimationFrame(draw)}}
function updatePaint(){
  makePaint();
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,mesh.vertices,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,index);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,mesh.indices,gl.STATIC_DRAW);
  const url=new URL(location.href);url.searchParams.set('world',worldSelect.value);url.searchParams.set('paint',mode);
  if(mode==='palette')url.searchParams.set('palette',paletteIndex);else url.searchParams.delete('palette');
  if(mode==='custom')url.searchParams.set('colours',paintKeys.map(k=>hex(customPaint[k]).slice(1)).join('-'));else url.searchParams.delete('colours');
  history.replaceState(null,'',url);paintLabel();request();
}
function paintLabel(){document.querySelector('#grey').setAttribute('aria-pressed',String(mode==='grey'));document.querySelector('#paintStatus').textContent=mode==='grey'?'Greyscale':mode==='palette'?'Palette '+paletteIndex:mode==='custom'?'Custom colours':worldSelect.selectedOptions[0].textContent+' paint';
const paint=mode==='custom'?customPaint:Ship05.paintForWorld(mode==='grey'?greyPalette:world);
for(const key of paintKeys){const input=document.querySelector('#colour-'+key);if(input)input.value=hex(paint[key])}
}
worldSelect.onchange=()=>{mode='world';updatePaint()};
document.querySelector('#grey').onclick=()=>{mode='grey';updatePaint()};
document.querySelector('#randomize').onclick=()=>{
  const previous=mode==='palette'?paletteIndex:world.palIdx;
  const random=new Uint32Array(1);crypto.getRandomValues(random);
  paletteIndex=(previous+1+random[0]%(PALETTES.length-1))%PALETTES.length;
  mode='palette';updatePaint();
};
for(const key of paintKeys){
  const label=document.createElement('label');label.textContent=({body:'Body',wings:'Wings',canopy:'Cockpit',underside:'Underside',accent:'Rim / exhaust'})[key];
  const input=document.createElement('input');input.type='color';input.id='colour-'+key;
  input.oninput=()=>{if(mode!=='custom')customPaint=Ship05.paintForWorld(mode==='grey'?greyPalette:world);customPaint[key]=rgb(input.value);mode='custom';updatePaint()};
  label.append(input);document.querySelector('#colours').append(label);
}
paintLabel();
const views={perspective:[.75,.5],front:[0,.14],side:[Math.PI/2,.14],top:[0,Math.PI/2-.001],rear:[Math.PI,.18]};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{[az,el]=views[b.dataset.view];document.querySelectorAll('[data-view]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));document.querySelector('#ref').classList.remove('open');document.querySelector('#reference').setAttribute('aria-pressed','false');request()});
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(-.45,Math.min(1.56,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];request()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(7,Math.min(22,distance*Math.exp(e.deltaY*.001)));request()},{passive:false});window.addEventListener('resize',request);document.addEventListener('visibilitychange',request);document.querySelector('#reference').onclick=e=>{const open=document.querySelector('#ref').classList.toggle('open');e.target.setAttribute('aria-pressed',String(open))};canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();document.querySelector('#error').textContent='Graphics context interrupted. Reload this preview to resume.'});request();
}catch(e){document.querySelector('#error').textContent=e.message;console.error(e)}})();
